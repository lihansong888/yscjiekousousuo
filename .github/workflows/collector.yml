name: 影视仓接口每日采集

on:
  schedule:
    
    - cron: "0 2 * * *"

  
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 获取源码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行采集程序
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py

      - name: 保存采集结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 接口列表.txt 接口检测结果.txt
          git diff --cached --quiet || git commit -m "每日更新影视仓配置接口"
          git push
